[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[images]
  remote_images = ["https://hzkcofnklmwbhcbybstu\\.supabase\\.co/.*"]

[functions]
  directory = "netlify/functions"

# Product slug changes: keep old indexed URLs working (301).
# A real page always wins over these rules, so a redirect listed here only
# takes effect once that page's slug changes.
[[redirects]]
  from = "/products/bridgestone-dueler-h-t-d684-275-60r20-115h/"
  to = "/products/bridgestone-dueler-h-t-d684-275-60r20-115h-2025/"
  status = 301

# Security headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
